name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  jvm:
    name: Build and test (JVM + Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew :shared:desktopTest :composeApp:desktopTest --stacktrace

      - name: Android lint
        run: ./gradlew :composeApp:lintRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew :composeApp:assembleRelease --stacktrace
        env:
          AURACAM_KEYSTORE_FILE: ${{ secrets.AURACAM_KEYSTORE_FILE }}
          AURACAM_KEYSTORE_PASSWORD: ${{ secrets.AURACAM_KEYSTORE_PASSWORD }}
          AURACAM_KEY_ALIAS: ${{ secrets.AURACAM_KEY_ALIAS }}
          AURACAM_KEY_PASSWORD: ${{ secrets.AURACAM_KEY_PASSWORD }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  apple:
    name: Compile Apple targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS simulator target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
